name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# The version in package.json is bumped in the commit that gets tagged, not by this
# workflow. CI committing the bump made the tag point at a tree without it, so the
# artifacts never matched the tag they were released under, and the push to main raced
# with anything else landing there.

jobs:
  # Guards the rule above. A tag whose tree declares a different version is the failure
  # that broke v0.1.2, and it is much cheaper to catch here than in a shipped artifact.
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Check package.json and tray/Cargo.toml match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./package.json').version")
          tray=$(sed -n 's/^version = "\(.*\)"/\1/p' tray/Cargo.toml | head -1)
          echo "tag=$tag package.json=$app tray/Cargo.toml=$tray"
          fail=0
          [ "$app" = "$tag" ] || { echo "::error::package.json is $app, expected $tag"; fail=1; }
          [ "$tray" = "$tag" ] || { echo "::error::tray/Cargo.toml is $tray, expected $tag"; fail=1; }
          exit $fail

  build-mac:
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # --publish never: electron-builder otherwise auto-detects the GitHub provider on a
      # tagged CI build and opens its own draft release named after the version, which is
      # where the second, tray-less v0.1.2 release came from. create-release below is the
      # only thing allowed to touch the release.
      - run: yarn dist:mac --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: dist/*.dmg*
          if-no-files-found: error

  build-win:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # electron-builder would otherwise publish its own draft release; see build-mac.
      - run: yarn dist:win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: dist/*.exe
          if-no-files-found: error

  build-linux:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # electron-builder would otherwise publish its own draft release; see build-mac.
      - run: yarn dist:linux --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  # The Cue Tray is a separate Rust program in tray/, not part of the Electron bundle, so
  # it needs its own build per platform. It ships as a bare binary: the cue sounds are
  # compiled into it and there is nothing to install alongside.
  tray-linux:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        # One package per -sys crate in the Linux graph:
        #   alsa-sys    -> libasound2-dev   (the audio device, via cpal)
        #   openssl-sys -> libssl-dev       (reqwest pulls native-tls; rust_engineio
        #                                    hardcodes it, so it cannot be turned off even
        #                                    though we only ever speak plain HTTP on a LAN)
        #   wayland-sys -> libwayland-dev
        # The rest is what eframe's winit and glow backends want on X11.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libssl-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tray

      - run: cargo build --release --locked
        working-directory: tray

      - run: cargo test --locked
        working-directory: tray

      - run: mv target/release/shotlister-tray shotlister-tray-linux-x86_64
        working-directory: tray

      - uses: actions/upload-artifact@v4
        with:
          name: tray-linux
          path: tray/shotlister-tray-linux-x86_64
          if-no-files-found: error

  tray-win:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tray

      # The build script vendors and compiles libopus, which wants cmake on PATH here.
      - uses: lukka/get-cmake@latest

      - run: cargo build --release --locked
        working-directory: tray

      - run: cargo test --locked
        working-directory: tray

      - run: mv target/release/shotlister-tray.exe shotlister-tray-windows-x86_64.exe
        working-directory: tray

      - uses: actions/upload-artifact@v4
        with:
          name: tray-win
          path: tray/shotlister-tray-windows-x86_64.exe
          if-no-files-found: error

  tray-mac:
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tray

      - run: cargo test --locked
        working-directory: tray

      # Must be a bundle, not a bare binary: without an Info.plist there is no LSUIElement,
      # so macOS gives it a Dock icon instead of a menu bar item.
      - run: ./scripts/bundle-mac.sh
        working-directory: tray

      # ditto rather than zip, so the ad-hoc signature survives the round trip.
      - name: Zip the app bundle
        working-directory: tray/target
        run: ditto -c -k --keepParent "Shotlister Cue Tray.app" "shotlister-cue-tray-${{ needs.verify-version.outputs.version }}-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: tray-mac
          path: tray/target/*.zip
          if-no-files-found: error

  create-release:
    needs: [build-mac, build-win, build-linux, tray-linux, tray-win, tray-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Create on the first run, upload on a re-run: one release per tag, holding every
      # platform's app installer and every platform's cue tray build.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" \
              --draft \
              --title "OBS Queuer v${{ steps.version.outputs.VERSION }}" \
              --generate-notes \
              artifacts/*
          fi
