name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn test

      # Typecheck and bundle. The renderer and the main process have different
      # module resolution, so a shared module that reaches for a Node builtin
      # passes both lint and tests and only fails here.
      - run: yarn build
