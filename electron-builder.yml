appId: com.obsqueuer.app
productName: Shotlister
copyright: Copyright © 2024

# Downloadable files are named after the project, so a release lists shotlister-* next to
# shotlister-tray-*.
artifactName: shotlister-${version}-${os}-${arch}.${ext}

# Files to include from the build output
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - out/web/**
  - package.json

# Extra resources copied outside the asar (accessible via process.resourcesPath)
extraResources:
  - from: resources/audio
    to: audio
    filter:
      - '**/*.opus'
  # The Piper engine, fetched by scripts/fetch-piper.mjs. Only the
  # target's own engine is copied — ${platform}-${arch} expands to exactly the
  # directory names that script writes — so a build never ships three engines.
  - from: resources/piper/${platform}-${arch}
    to: piper
  # Voice models are deliberately NOT here. They are fetched on demand into
  # userData by src/main/speech/voices.ts — one model is 60-110MB, there are
  # hundreds of them, and bundling a guess would add that to every installer for
  # a voice most operators change anyway. The cost is that a brand-new install
  # needs a network before it can render its first clip; rendering already only
  # happens ahead of a show, never during one (ADR 0005).

# Never unpack better-sqlite3 native module from asar
asarUnpack:
  - '**/*.node'

directories:
  output: dist
  buildResources: build

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
  icon: build/icon.icns

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
  icon: build/icons
  category: AudioVideo
  maintainer: obs-queuer

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
