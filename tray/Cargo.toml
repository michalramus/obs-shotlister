[package]
name = "shotlister-tray"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Plays a shotlister Live session's audio cues on the video switching computer"
license = "MIT"
publish = false

[dependencies]
arc-swap = "1.9.2"
crossbeam-channel = "0.5.17"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
rust_socketio = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
ogg = "0.9.2"
opus = "0.4.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
# Deliberately unwind, not abort: this runs unattended during a show, so a panic in the
# socket or audio thread must be contained and recovered rather than killing the process
# mid-programme. The ~300 KB abort would save is bought back by pruning rodio's features.
panic = "unwind"
