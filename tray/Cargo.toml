[package]
name = "shotlister-tray"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Plays a shotlister Live session's audio cues on the video switching computer"
license = "MIT"
publish = false

[dependencies]
arc-swap = "1.9.2"
clap = { version = "4.5.61", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
crossbeam-channel = "0.5.17"
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6.0.0"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
rodio = { version = "0.22", default-features = false, features = ["playback"] }
rust_socketio = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
ogg = "0.9.2"
opus = "0.4.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
# Deliberately unwind, not abort: this runs unattended during a show, so a panic in the
# socket or audio thread must be contained and recovered rather than killing the process
# mid-programme. The ~300 KB abort would save is bought back by pruning rodio's features.
panic = "unwind"

# Windows and macOS deliver tray events through the same native run loop the window uses,
# so one main thread can own both.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.22"

# On Linux tray-icon is GTK-based and wants a GTK main loop on the main thread, which is
# where winit has to be. ksni speaks StatusNotifierItem over D-Bus from its own thread with
# no GUI toolkit involved, and SNI is what Cinnamon, KDE, Xfce and GNOME's AppIndicator
# extension actually implement.
[target.'cfg(target_os = "linux")'.dependencies]
# `blocking` rather than the default tokio integration: the tray needs one D-Bus thread,
# not an async runtime.
ksni = { version = "0.3", default-features = false, features = ["blocking"] }
